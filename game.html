<!doctype html>
<html>
  <head>
    <title>Arithmetic Game – Online Speed Drill</title>
    <link href="/app.css" rel="stylesheet" />
  </head>
  <body>
    <script
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
    ></script>
    <div id="game">
      <span class="left">Seconds left:</span>
      <span class="correct">Score: 0</span>
      <div class="banner">
        <div class="start">
          <span class="problem"></span>
          =
          <input class="answer" />
        </div>
        <div class="end">
          <p class="correct">Score: 0</p>
          <p>
            <a href="/game?key=0172800b">Try again</a>
            or <a href="/">change settings</a>.
          </p>
        </div>
      </div>
    </div>
    <script type="module">
      import { init } from './app.js';
      init({"add":true,"sub":true,"mul":true,"div":true,"duration":60,"add_left_min":2,"add_left_max":100,"add_right_min":2,"add_right_max":100,"mul_left_min":2,"mul_left_max":12,"mul_right_min":2,"mul_right_max":100});
    </script>
  </body>
</html>
