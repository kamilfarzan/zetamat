<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arithmetic Game – Online Speed Drill</title>
    <link href="./app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="game">
      <span class="left">Seconds left:</span>
      <span class="correct">Score: 0</span>
      <div class="banner">
        <div class="start">
          <span class="problem"></span>
          =
          <input class="answer" />
        </div>
        <div class="end">
          <p class="correct">Score: 0</p>
          <div class="pacing-chart" id="postGamePacing"></div>
          <p class="end-actions">
            <a href="./game.html" class="try-again-link">Try again</a>,
            <a href="./index.html">change settings</a>,
            or <a href="./stats.html">view stats</a>.
          </p>
        </div>
      </div>
    </div>
    <script type="module">
      import { init } from './app.js';
      init();
    </script>
  </body>
</html>
